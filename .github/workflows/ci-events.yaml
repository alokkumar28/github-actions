name: "Event Driven Workflow"
on:
    workflow_dispatch:
    push:
    pull_request:
    schedule:
        - cron: "*/5 * * * *"
jobs:
    event-driven-job:
        runs-on: ubuntu-latest
        steps:
            - name: "Print Event Context"
              run: 'echo "Event Name: ${{ github.event_name }}"'