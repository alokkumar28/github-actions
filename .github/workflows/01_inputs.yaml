name: 01 - Type 1 Workflow Input Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - prod

      perform_smoke_test:
        description: Execute Smoke Test
        required: true
        type: boolean
        default: true

env:
  APP_NAME: demo-app-gha
  DOCKER_USERNAME: alokkumar01
  IMAGE_TAG: v1.01

jobs:
  app-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Display Input Value
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Perform Smoke Test: ${{ inputs.perform_smoke_test }}"

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

      - name: QA Validate
        if: ${{ inputs.environment == 'qa' }}
        run: |
          echo "Performing QA Validation"
          echo "Smoke Test: ${{ inputs.perform_smoke_test }}"
          echo "Running QA Validation for ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"

      - name: Docker Login
        if: ${{ inputs.environment != 'dev' }}
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        if: ${{ inputs.environment != 'dev' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run Container
        run: |
          docker run -d \
            --name ${{ env.APP_NAME }} \
            -p 3000:3000 \
            ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
        
      - name: Smoke Test
        if: ${{ inputs.perform_smoke_test == 'true' }}
        run: |
          echo "Running Smoke Test for ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"
          sleep 5
          curl -f http://localhost:3000 || (echo "Smoke Test Failed" && exit 1)   

      - name: Deploy to Kubernetes
        if: ${{ inputs.environment == 'prod' }}
        run: |
          echo "Deploying to Kubernetes for ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}"
          echo " Deployment Successful for ${{ env.APP_NAME }}:${{ env.IMAGE_TAG }} in Production Environment"
