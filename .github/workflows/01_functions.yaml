name: Build Test Publish Workflow

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "server/**"
      - ".github/workflows/**"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review
    paths:
      - "server/**"
      - ".github/workflows/**"

env:
  APP_NAME: demo-app-gha
  DOCKER_USERNAME: alokkumar01

jobs:
  alok-server-build-test-publish-job:
    runs-on: ubuntu-latest

    if: >-
      ${{ (github.event_name == 'push') || (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, 'WIP')) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Display Build Information
        run: |
          echo "Application: $APP_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "GitHub Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          load: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}

      - name: Run Docker Container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name alok-server \
            "$DOCKER_USERNAME/$APP_NAME:$IMAGE_TAG"

      - name: Smoke Test
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:3000/
          curl --fail http://localhost:3000/health

      - name: Push Docker Image
        if: ${{ success() && github.event_name == 'push' }}
        run: |
          docker push "$DOCKER_USERNAME/$APP_NAME:$IMAGE_TAG"

      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs alok-server || true

      - name: Clean Up Container
        if: ${{ always() }}
        run: |
          docker rm -f alok-server || true
